<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>房间</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='9' fill='%23d9643a'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%232f7fb8' fill-opacity='.85'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body data-view="loading">
    <main class="screen">
      <div class="screen-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="screen-title">正在连接</h1>
      <p id="screen-text"></p>
      <div class="screen-actions">
        <a id="screen-new" class="btn" href="/" hidden>新建房间</a>
        <button id="screen-rejoin" class="btn ghost" type="button" hidden>重新加入</button>
      </div>
    </main>

    <div class="chat">
      <header class="bar">
        <div class="room">
          <span class="room-label">房间</span>
          <strong id="room-code" class="room-code"></strong>
          <span id="lock-chip" class="chip" hidden>已锁定</span>
          <button id="copy-link" class="btn small ghost" type="button">复制链接</button>
        </div>
        <div id="members" class="members" aria-label="房间成员"></div>
        <div class="controls">
          <button id="lock" class="btn small ghost" type="button" aria-pressed="false">禁止新人加入</button>
          <button id="leave" class="btn small ghost" type="button">离开</button>
          <button id="end" class="btn small danger" type="button">结束房间</button>
        </div>
      </header>

      <div id="banner" class="banner" role="status" hidden></div>
      <section id="log" class="log" aria-live="polite"></section>

      <footer class="composer">
        <textarea id="input" rows="1" maxlength="4000" placeholder="说点什么…" aria-label="消息"></textarea>
        <button id="send" class="btn" type="button">发送</button>
      </footer>
      <p id="hint" class="hint"></p>
    </div>
  </body>
</html>
